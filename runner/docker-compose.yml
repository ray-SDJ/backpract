# Self-hosted Piston for the compiled languages (Java, C#, Go, Rust, C++).
# JavaScript, TypeScript, Python, SQL, PHP and Ruby run in the browser and
# don't need this. See runner/README.md.
services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston
    restart: unless-stopped
    # Piston sandboxes every run with isolate, which needs privileged mode
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - ./data/piston/packages:/piston/packages
    tmpfs:
      - /tmp:exec
